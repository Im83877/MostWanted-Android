name: Find Checkpoint
on: workflow_dispatch
jobs:
  find:
    runs-on: windows-2025
    timeout-minutes: 300
    env:
      NDK_VERSION: 28.2.13676358
      CMAKE_VERSION: 3.31.6
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK packages
        shell: cmd
        run: call "%ANDROID_HOME%\cmdline-tools\latest\bin\sdkmanager.bat" --install "platforms;android-34" "ndk;%NDK_VERSION%" "cmake;%CMAKE_VERSION%" >nul
      - name: Decrypt default.xbe
        shell: bash
        env:
          XBE_KEY: ${{ secrets.XBE_KEY }}
        run: |
          if [ -z "$XBE_KEY" ]; then echo "::error::XBE_KEY missing"; exit 1; fi
          mkdir -p assets
          key="$RUNNER_TEMP/xbe.key"
          printf '%s' "$XBE_KEY" | tr -d '\r\n' > "$key"
          openssl enc -d -aes-256-cbc -md sha256 -pbkdf2 -iter 200000 -in ci/default.xbe.enc -out assets/default.xbe -pass "file:$key"
          rm -f "$key"
          sha=$(sha1sum assets/default.xbe | cut -d' ' -f1)
          echo "default.xbe SHA-1 $sha"
          if [ "$sha" != "f636a16af04171089f879a4bed646e185c734233" ]; then echo "::error::default.xbe not supported"; exit 1; fi
      - name: Build tools + Recompile
        shell: cmd
        run: call build.bat
      - name: Search checkpoint in generated
        shell: bash
        run: |
          python3 - << 'PYEOF'
          import pathlib, re, struct
          txt = pathlib.Path("generated/game/x86_recomp.25.cpp").read_text(errors="ignore")
          idx = txt.find("sub_000CDA40")
          chunk = txt[idx:idx+20000]
          print(f"CHUNK LEN: {len(chunk)}")
          print(chunk[:4000])
          print("---ANGKA HEX---")
          hexes = re.findall(r"0x[0-9A-Fa-f]{8}", chunk)
          print(f"TOTAL HEX: {len(hexes)}")
          # coba jadiin float, liat yang masuk akal buat koordinat map (-2000..2000)
          vals = []
          for h in hexes:
              try:
                  f = struct.unpack("<f", struct.pack("<I", int(h,16)))[0]
                  if abs(f) < 5000 and abs(f) > 0.001:
                      vals.append(round(f,2))
              except:
                  pass
          print(f"FLOAT MASUK AKAL: {len(vals)}")
          print(vals[:100])
          PYEOF
