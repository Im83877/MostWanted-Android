name: Find AI EA
on: workflow_dispatch
jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: |
          chmod +x build.sh 2>/dev/null || true
          ls tools/ 2>&1 | head
      - name: Search AIActionRace in generated
        run: |
          find . -name "*.cpp" -path "*generated*" | head
          grep -rn "AIActionRace\|PATH_control\|PathControl" generated/ 2>&1 | head -n 100
          echo DONE
